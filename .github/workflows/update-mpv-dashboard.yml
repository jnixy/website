name: Update MPV Dashboard Data

on:
  schedule:
    # Run weekly on Mondays at 7 AM UTC (after the research feed job at 6 AM)
    - cron: '0 7 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate MPV dashboard data
      run: |
        python scripts/generate_mpv_dashboard.py

    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add static/data/mpv-dashboard.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update MPV dashboard data [automated]" && git pull --rebase && git push)
